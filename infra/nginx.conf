# Frontend static + /api reverse proxy. TLS host-level nginx (ya nginx.tls.conf.example) se lagta hai.
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;
    limit_req_status 429;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;

    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        limit_req zone=api_rl burst=20 nodelay;
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
