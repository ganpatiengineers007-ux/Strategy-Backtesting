# Production stack. Chalane se pehle infra/.env me API_KEY bharo (infra/.env.example dekho).
name: strategy-lab

services:
  runs-init:
    image: python:3.12-slim
    command: ["sh", "-c", "chown -R 10001:10001 /app/runs"]
    user: "0:0"
    volumes:
      - ../runs:/app/runs
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    depends_on:
      runs-init:
        condition: service_completed_successfully
    environment:
      SVL_ENV: production
      API_KEY: ${API_KEY:?API_KEY set karo (infra/.env me)}
      ADMIN_USER: ${ADMIN_USER:?ADMIN_USER set karo (infra/.env me)}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH set karo (infra/.env me)}
      FYERS_HUB_HOME: /app/runs/fyers_hub
      FYERS_ENV_FILE: /home/app/.fyers_hub/.env
      FYERS_TOKEN_PATH: /app/runs/fyers_hub/token.json
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RUN_ISOLATED: "1"
      DATA_DIR: /app/data/samples
      RUNS_ROOT: /app/runs
      DATABASE_URL: sqlite:////app/runs/svl.sqlite3
      HUB_DB_PATH: /app/runs/hub.db
      JOB_STATE_DIR: /app/runs/.jobs
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-1}
    volumes:
      - ../runs:/app/runs
      - ../data:/app/data:ro
      # Secrets read-only; tokens/pending state writable under /app/runs (FYERS_HUB_HOME).
      - ${FYERS_HUB_HOST_DIR:-${HOME}/.fyers_hub}:/home/app/.fyers_hub:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
      args:
        VITE_API_BASE: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
