syntax = "proto3";
package svl;

import "common.proto";

message Bar {
  string ts = 1;
  double open = 2;
  double high = 3;
  double low = 4;
  double close = 5;
  double volume = 6;
  map<string, double> extras = 7;
}

message Dataset {
  string dataset_id = 1;
  string symbol = 2;
  string timeframe = 3;
  string start_time = 4;
  string end_time = 5;
  string timezone = 6;
  string source = 7;
  string schema_version = 8;
  string content_hash = 9;
  QualityStatus quality_status = 10;
  repeated Bar bars = 11;
}
