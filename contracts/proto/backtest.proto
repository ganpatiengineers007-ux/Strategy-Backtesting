syntax = "proto3";
package svl;

message Trade {
  string entry_ts = 1;
  string exit_ts = 2;
  double entry_price = 3;
  double exit_price = 4;
  int64 qty = 5;
  double pnl = 6;
  double fees = 7;
  string reason = 8;
}

message EquityPoint {
  string ts = 1;
  double equity = 2;
}

message BacktestRequest {
  string strategy_id = 1;
  string dataset = 2;
  map<string, string> params = 3;
  string symbol = 4;
  string timeframe = 5;
}

message BacktestResult {
  string run_id = 1;
  string status = 2;
  string reason = 3;
  repeated Trade trades = 4;
  repeated EquityPoint equity = 5;
}
