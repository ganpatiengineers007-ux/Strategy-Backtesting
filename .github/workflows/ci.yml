name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-prod.txt pytest httpx
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - run: go vet ./...
        working-directory: engines/go
      - run: go test ./...
        working-directory: engines/go

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S engines/cpp -B engines/cpp/build
      - run: cmake --build engines/cpp/build
      - run: ctest --test-dir engines/cpp/build --output-on-failure

  docker:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    env:
      API_KEY: ci-dummy-key-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose.yml config --quiet
      - run: docker build -f infra/Dockerfile -t svl-backend:ci .
      - run: docker build -f infra/Dockerfile.frontend -t svl-web:ci .
